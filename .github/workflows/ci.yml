# CI: runs on every pull request and on pushes to main / staging / develop.
# Checks the code passes analysis and tests, and still builds (unsigned debug APK).
name: CI

on:
  pull_request:
  push:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the Android platform the app compiles against
        run: |
          PLATFORM=$(grep -oE 'compileSdk(Version)?[ =]+[0-9]+' android/app/build.gradle | grep -oE '[0-9]+$' | head -1)
          echo "Installing Android platform $PLATFORM"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list 2>/dev/null | grep -oE "platforms;android-${PLATFORM}[^ ]*" | sort -u | head -1 | xargs -r sdkmanager --install
          # The package may install as android-<N>.0 while Gradle looks for android-<N>: make both names resolve.
          P="$ANDROID_HOME/platforms"
          if [ -d "$P/android-${PLATFORM}.0" ] && [ ! -e "$P/android-${PLATFORM}" ]; then ln -s "android-${PLATFORM}.0" "$P/android-${PLATFORM}"; fi
          ls "$P"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build debug APK (unsigned smoke build, one CPU type)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
