# CD with three environments. The environment is chosen by what you push:
#
#   push to develop      -> dev         signed APK (artifact only)
#   push to staging      -> staging     signed APK (artifact only)
#   push a tag v1.2.3    -> production  signed AAB + APK, GitHub Release, Google Play upload
#   run by hand          -> any of the three (Actions > CD > Run workflow)
#
# Create the three environments under Settings > Environments (dev, staging, production).
# On "production" tick "Required reviewers" so a release waits for an approval click.
# Each environment holds its own variables (Settings > Environments > <name> > Variables):
#   API_BASE_URL       server the app talks to, e.g. https://dev.example.com/api  (leave empty on production: the app's built-in live address is used)
#   ONESIGNAL_APP_ID   optional, push notifications
#   SENTRY_DSN         optional, error reporting
#
# Repository secrets (shared by all environments):
#   ANDROID_KEYSTORE_BASE64      base64 of the .jks file   (base64 -w0 vgow.jks)
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias
#   ANDROID_KEY_PASSWORD         key password
#   PLAY_SERVICE_ACCOUNT_JSON    optional, Google Play service-account JSON (production only)
name: CD

on:
  push:
    branches: [develop, staging]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build for
        default: dev
        type: choice
        options: [dev, staging, production]
      play_track:
        description: Google Play track (production only)
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || github.ref_name == 'staging' && 'staging' || 'dev') }}
    env:
      TARGET_ENV: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || github.ref_name == 'staging' && 'staging' || 'dev') }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the Android platform the app compiles against
        run: |
          PLATFORM=$(grep -oE 'compileSdk(Version)?[ =]+[0-9]+' android/app/build.gradle | grep -oE '[0-9]+$' | head -1)
          echo "Installing Android platform $PLATFORM"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list 2>/dev/null | grep -oE "platforms;android-${PLATFORM}[^ ]*" | sort -u | head -1 | xargs -r sdkmanager --install
          P="$ANDROID_HOME/platforms"
          if [ -d "$P/android-${PLATFORM}.0" ] && [ ! -e "$P/android-${PLATFORM}" ]; then ln -s "android-${PLATFORM}.0" "$P/android-${PLATFORM}"; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_* secrets"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Work out build settings for ${{ env.TARGET_ENV }}
        run: |
          DEFINES=""
          if [ -n "$API_BASE_URL" ]; then DEFINES="$DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"; fi
          if [ -n "$ONESIGNAL_APP_ID" ]; then DEFINES="$DEFINES --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID"; fi
          if [ -n "$SENTRY_DSN" ]; then DEFINES="$DEFINES --dart-define=SENTRY_DSN=$SENTRY_DSN"; fi
          echo "DEFINES=$DEFINES" >> "$GITHUB_ENV"
          echo "Building for $TARGET_ENV with:$DEFINES"

      - name: Build release APK
        run: flutter build apk --release $DEFINES

      - name: Build release AAB (production only)
        if: env.TARGET_ENV == 'production'
        run: flutter build appbundle --release $DEFINES

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_ENV }}-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: ${{ env.TARGET_ENV == 'production' && 90 || 14 }}

      - name: Create GitHub Release
        if: env.TARGET_ENV == 'production' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload to Google Play
        if: env.TARGET_ENV == 'production' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rubia.user
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: completed
