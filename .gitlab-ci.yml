# GitLab CI/CD for the Rubia customer app (Flutter, Android) with three environments.
#
#   verify      every push and merge request   flutter analyze + flutter test
#   build       every push and merge request   debug APK (unsigned smoke build, kept 7 days)
#   deploy      by branch / tag:
#     develop        -> dev          signed APK (artifact, kept 14 days)
#     staging        -> staging      signed APK (artifact, kept 14 days)
#     tag v1.2.3     -> production   signed AAB + APK (artifact, kept 90 days)
#
# Create the three environments by pushing once; then set variables under Settings > CI/CD > Variables.
# Shared by all environments (masked; protected):
#   ANDROID_KEYSTORE_BASE64     base64 of the .jks file   (base64 -w0 jks/vgow.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
# Per environment (give each one the Environment scope dev / staging / production):
#   API_BASE_URL     server the app talks to, e.g. https://dev.example.com/api  (leave unset on production: the built-in live address is used)
#   ONESIGNAL_APP_ID optional, push App ID for that environment
#   SENTRY_DSN       optional, error reporting address for that environment
# Protect the main branch, the staging branch and v* tags (Settings > Repository) so only maintainers can release.
# Raise versionCode / versionName in android/app/build.gradle before tagging; Google Play rejects a repeated versionCode.
# Uploading the AAB to Google Play is not automated here: download it from the production job's artifacts.

image: ghcr.io/cirruslabs/flutter:stable

stages:
  - verify
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# The runner image lacks the Android platform the app compiles against (compileSdk in android/app/build.gradle);
# Gradle does not fetch it, so install it first. Safe to repeat: sdkmanager skips what is already there.
.android-sdk: &android_sdk
  - yes | sdkmanager --licenses > /dev/null 2>&1 || true
  - |
    PLATFORM=$(grep -oE 'compileSdk(Version)?[ =]+[0-9]+' android/app/build.gradle | grep -oE '[0-9]+$' | head -1)
    echo "Installing Android platform $PLATFORM"
    sdkmanager --list 2>/dev/null | grep -oE "platforms;android-${PLATFORM}[^ ]*" | sort -u | head -1 | xargs -r sdkmanager --install
    # The package installs as android-<N>.0 while Gradle looks for android-<N>: make both names resolve.
    P="$ANDROID_SDK_ROOT/platforms"; [ -n "$ANDROID_SDK_ROOT" ] || P="/opt/android-sdk-linux/platforms"
    ls "$P" || true
    [ -d "$P/android-${PLATFORM}.0" ] && [ ! -e "$P/android-${PLATFORM}" ] && ln -s "android-${PLATFORM}.0" "$P/android-${PLATFORM}" && echo "linked android-${PLATFORM}"

default:
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
      - .gradle/caches/
      - .gradle/wrapper/

verify:
  stage: verify
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test

build:debug-apk:
  stage: build
  needs: ["verify"]
  before_script:
    - *android_sdk
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - flutter pub get
    # One CPU type is enough for a smoke build; all three fill the free runner's small disk.
    - flutter build apk --debug --target-platform android-arm64
  artifacts:
    expire_in: 7 days
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk

.android-signed-build:
  stage: deploy
  before_script:
    - *android_sdk
    - test -n "$ANDROID_KEYSTORE_BASE64" -a -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_* CI/CD variables"; exit 1; }
    - flutter pub get
    - |
      DEFINES=""
      if [ -n "$API_BASE_URL" ]; then DEFINES="$DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"; fi
      if [ -n "$ONESIGNAL_APP_ID" ]; then DEFINES="$DEFINES --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID"; fi
      if [ -n "$SENTRY_DSN" ]; then DEFINES="$DEFINES --dart-define=SENTRY_DSN=$SENTRY_DSN"; fi
      echo "DEFINES=\"$DEFINES\"" > build.env
      echo "Building for $CI_ENVIRONMENT_NAME with:$DEFINES"
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.jks"
    - |
      cat > android/key.properties <<PROPS
      storeFile=$CI_PROJECT_DIR/release.jks
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      keyPassword=$ANDROID_KEY_PASSWORD
      PROPS
  after_script:
    - rm -f android/key.properties release.jks build.env

deploy:dev:
  extends: .android-signed-build
  needs: ["verify"]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment:
    name: dev
  resource_group: dev
  script:
    - . ./build.env
    - flutter build apk --release $DEFINES
  artifacts:
    expire_in: 14 days
    paths:
      - build/app/outputs/flutter-apk/app-release.apk

deploy:staging:
  extends: .android-signed-build
  needs: ["verify"]
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  environment:
    name: staging
  resource_group: staging
  script:
    - . ./build.env
    - flutter build apk --release $DEFINES
  artifacts:
    expire_in: 14 days
    paths:
      - build/app/outputs/flutter-apk/app-release.apk

deploy:production:
  extends: .android-signed-build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  environment:
    name: production
  resource_group: production
  script:
    - . ./build.env
    - flutter test
    - flutter build appbundle --release $DEFINES
    - flutter build apk --release $DEFINES
  artifacts:
    expire_in: 90 days
    paths:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
