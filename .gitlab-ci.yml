# GitLab CI/CD for the Rubia customer app (Flutter, Android).
#
#   verify   every push and merge request   flutter analyze + flutter test
#   build    every push and merge request   debug APK (unsigned smoke build, kept 7 days)
#   release  version tags (v1.0.6 ...)      signed release AAB + APK, kept 30 days
#
# Set these under Settings > CI/CD > Variables (masked; mark them protected so only protected tags can use them):
#   ANDROID_KEYSTORE_BASE64     base64 of the .jks file   (base64 -w0 jks/vgow.jks)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
# Raise versionCode / versionName in android/app/build.gradle before tagging; Google Play rejects a repeated versionCode.
# Uploading the AAB to Google Play is not automated here: download it from the release job's artifacts.

image: ghcr.io/cirruslabs/flutter:stable

stages:
  - verify
  - build
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

default:
  cache:
    key:
      files:
        - pubspec.lock
    paths:
      - .pub-cache/
      - .gradle/caches/
      - .gradle/wrapper/

verify:
  stage: verify
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos --no-fatal-warnings
    - flutter test

build:debug-apk:
  stage: build
  needs: ["verify"]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - flutter pub get
    - flutter build apk --debug
  artifacts:
    expire_in: 7 days
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk

release:android:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - test -n "$ANDROID_KEYSTORE_BASE64" -a -n "$ANDROID_KEYSTORE_PASSWORD" -a -n "$ANDROID_KEY_ALIAS" -a -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_* CI/CD variables"; exit 1; }
    - flutter pub get
    - flutter test
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.jks"
    - |
      cat > android/key.properties <<PROPS
      storeFile=$CI_PROJECT_DIR/release.jks
      storePassword=$ANDROID_KEYSTORE_PASSWORD
      keyAlias=$ANDROID_KEY_ALIAS
      keyPassword=$ANDROID_KEY_PASSWORD
      PROPS
    - flutter build appbundle --release
    - flutter build apk --release
  after_script:
    - rm -f android/key.properties release.jks
  artifacts:
    expire_in: 30 days
    paths:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
